# =======================================================
# MSOSL - Tmux configuration file
#
# Testing this configuration file
# - no tmux must be active on terminal
#
# Run for testing: tmux -f .tmux.conf
# For checking colors in tmux run: tput colors
#
# Manged by ansible:
# Project: MPOSL-dotfiles
# =======================================================

# -- General --
set -g base-index 1                    # Start window Index from 1 instead of 0
set-window-option -g pane-base-index 1 # Start pane index from 1 instead of 0
set -g history-limit 5000              # History limit

# -- Title (not sure how is working) --
set -g set-titles on
set -g set-titles-string "#T"

# -- Mouse support --
# Allows:
# - Pane Resizing
# - Switching Between Panes
# - Scrolling in the Scrollback Buffer
# - Selecting and Switching Windows
# - Text Selection and Copying
# I Liked this however my konsole was not able to have right-menu any longer
# set -g mouse on

# -- Status bar --
set -g status-justify centre           # Center align the window list
set -g status-bg black
set -g status-interval 15
set -g status-style fg=white,bg=blue

set -g status-left-length 30
set -g status-left '#[fg=white][#[fg=blue]#S#[fg=white]] #{?window_zoomed_flag,(ZOOM),} #{?pane_synchronized,(SYNC),}'
set -g status-right '#[fg=green]#(whoami)@#H#[default] #[fg=yellow]%Y/%m/%d %H:%M#[default]'

# -- Styles --
set-window-option -g window-status-current-style fg=black,bg=brightyellow # Active window style
set-window-option -g window-status-style fg=brightwhite,bg=black          # Inactive window style

# Set the border style for active and inactive panes
set -g pane-border-style fg=green
set -g pane-active-border-style fg=blue

# Related with synchroznized panes
# Based on: https://blog.jpalardy.com/posts/tmux-synchronized-panes/
setw -g window-status-current-format '#{?pane_synchronized,#[bg=red],}#I:#W'
setw -g window-status-format         '#{?pane_synchronized,#[bg=red],}#I:#W'

# --- Binding keys ---
bind r source-file ~/.tmux.conf \; display "Reloaded!" # Reload configuration file
bind e setw synchronize-panes                          # Easily toggle synchronization

# Open new terminal quickly to do small shell commands
unbind t
bind -r t run-shell "tmux new-window -n shell && tmux select-window -p && tmux join-pane -l 15 -s shell"


